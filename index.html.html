/* ===============================

=============================== */
.container{

}

    font-size:24px;
    margin-bottom:15px;
    font-weight:700;
}

.grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(190px,1fr));
    gap:22px;
}

.card{
    background:white;
    border-radius:18px;
    padding:13px;
    box-shadow:0 6px 15px rgba(255,140,160,0.25);
    transition:0.25s ease;
    border:2px solid transparent;
}

.card:hover{
    transform:translateY(-6px);
    border:2px solid #FFB6D5;
    box-shadow:0 15px 25px rgba(255,130,170,0.35);
}

.card img{
    width:100%;
    height:160px;
    object-fit:cover;
    border-radius:15px;
}

.card h3{
    font-size:17px;
    margin:10px 0 5px;
    font-weight:700;
    color:#AD1457;
}

.card p{
    font-size:13px;
    color:#555;
    height:38px;
    overflow:hidden;
    font-weight:500;
}

.price{
    color:var(--pink-dark);
    font-weight:700;
    margin-top:4px;
    font-size:14px;
}

.stock{
    color:#444;
    font-size:12.5px;
    margin-bottom:6px;
}

/* ===============================
        BUTTON AESTHETIC
=============================== */
.btn-beli,

    border-radius:12px;
    width:100%;
    margin-top:8px;
    font-weight:700;
    cursor:pointer;
    font-family:"Quicksand";
}

.btn-beli{
    background:linear-gradient(90deg, #FF8FB1, #FF5C8A);

.btn-detail{
    background:#FFD1E8;
    color:#AD1457;
}

.btn-beli:hover{
    background:linear-gradient(90deg, #FF5C8A, #FF2F74);
}

.btn-detail:hover{
    background:#FFB6D5;
}

/* ===============================
        MODAL / POPUP
=============================== */
.modal{
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(3px);
    justify-content:center;
    align-items:center;
    padding:15px;
}

.modal-content{
    background:white;
    width:85%;
    max-width:430px;
    padding:22px;
    border-radius:22px;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
    animation:popup .25s ease;
    max-height:80vh;
    overflow-y:auto;
}

@keyframes popup{
    from{transform:scale(0.7); opacity:0;}
    to{transform:scale(1); opacity:1;}
}

.modal-content h2{
    color:#C2185B;
}

.close-btn{
    background:#c61349;
    padding:10px;
    border:none;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
    width:100%;
    margin-top:15px;
}

.close-btn:hover{
    background:#FF5C8A;
    color:white;
}

/* ========== TAMPILKAN PRODUK ========== */
function loadProducts(){
    let wrap = document.getElementById("productList");
    wrap.innerHTML = "";

    products.forEach(p => {
        let shortDesc = p.description.length > 35 
                        ? p.description.substring(0,35) + "..." 
                        : p.description;

        wrap.innerHTML += `
        <div class="card">
            <img src="${p.image}">
            <h3>${p.name}</h3>
            <p>${shortDesc}</p>
            <div class="price">Rp ${p.price.toLocaleString()}</div>
            <div class="stock">Stok: ${p.stock}</div>

            <button class="btn-detail" onclick="showDetail(${p.id})">Detail</button>
            <button class="btn-beli" onclick="beli(${p.id})">Beli</button>
        </div>`;
    });
}

/* ========== POP-UP ========== */
function showDetail(id){
    const p = products.find(x => x.id === id);

    const modal = document.getElementById("modal");
    const content = document.getElementById("modalContent");

    content.innerHTML = `
        <h2>${p.name}</h2>
        <img src="${p.image}" style="width:100%;border-radius:18px; margin-bottom:12px;">
        <p style="font-size:15px;color:#555;">${p.description}</p>
        <p><b>Harga:</b> Rp ${p.price.toLocaleString()}</p>
        <p><b>Stok:</b> ${p.stock}</p>
        <button class="close-btn" onclick="closeModal()">Tutup</button>
    `;
    modal.style.display = "flex";
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

window.onclick = function(e){
    if(e.target.id === "modal"){
        closeModal();
    }
}

/* ========== FUNGSI BELI ========== */
function beli(id){
    const product = products.find(p => p.id === id);
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let existing = cart.find(item => item.id === id);

    if(existing){
        existing.qty += 1;
    } else {
        cart.push({
            id: product.id,
            name: product.name,
            price: product.price,
            qty: 1
        });
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    alert("🧺 '" + product.name + "' berhasil ditambahkan ke Basket!");
}
