<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login Toko Rajut Cute</title>
<style>
  body{
    margin:0;
    padding:0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #FFDEE9, #9d1a4e);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card{
    background:#ffffffcc;
    backdrop-filter: blur(10px);
    padding:50px;
    border-radius:40px;
    width:420px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    text-align:center;
  }
  h2{
    margin-top:0;
    color:#ff7aa2;
    font-weight:700;
  }
  input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:2px solid #ffb6c1;
    margin:10px 0;
    outline:none;
    font-size:14px;
  }
  button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#ff7aa2;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
  }
  button:hover{
    background:#ff588c;
  }
  .error{
    color:red;
    font-size:14px;
    display:none;
    margin-top:5px;
  }
</style>
</head>
<body>
  <div class="card">
    <h2>🎀Fashion Cardigan🎀</h2>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <p class="error" id="error">Username atau password salah!</p>
  </div>
<script>
  function login(){
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;

    if(user === "user" && pass === "user"){
      alert("Login Berhasil! Selamat datang di Toko Rajut Cute ✨");
      window.location.href = "shop.html";
    } else {
      document.getElementById('error').style.display = 'block';
    }
  }
</script>
</body>
</html>
